<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin - Aprofundamento Radical</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 text-white p-4 md:p-8">
<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl md:text-4xl font-bold mb-8 text-pink-500">⚙️ Painel do Administrador</h1>

  <!-- LOGIN -->
  <div id="login" class="bg-neutral-800 p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl mb-4">Acesso Restrito</h2>
    <input id="senha" type="password" placeholder="Digite a senha" class="w-full p-3 rounded bg-neutral-700 mb-4 border border-neutral-600 focus:border-pink-500 outline-none">
    <button onclick="entrar()" class="bg-pink-600 hover:bg-pink-700 w-full px-6 py-3 rounded font-bold transition">Entrar</button>
    <p class="text-sm text-neutral-400 mt-4">Senha padrão: <code class="bg-neutral-700 px-2 py-1 rounded">radical2027</code></p>
  </div>

  <!-- EDITOR -->
  <div id="editor" class="hidden space-y-6">
    
    <div class="bg-neutral-800 p-6 rounded-xl border border-neutral-700">
      <h3 class="text-xl font-bold mb-4 text-orange-400">🖼️ Seção Principal (Hero)</h3>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">Imagem de Fundo (URL - Cloudinary ou outro)</span>
        <input id="f_heroImage" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none">
      </label>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">Logo do Menu (URL da imagem, deixe em branco para não mostrar)</span>
        <input id="f_logo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none">
      </label>
    </div>

    <div class="bg-neutral-800 p-6 rounded-xl border border-neutral-700">
      <h3 class="text-xl font-bold mb-4 text-orange-400">📝 Título Principal</h3>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">Tipo do Título:</span>
        <select id="f_tituloTipo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none">
          <option value="texto">Texto</option>
          <option value="imagem">Imagem (Logo/Banner)</option>
        </select>
      </label>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">Conteúdo do Título (O texto OU o link da imagem)</span>
        <input id="f_tituloConteudo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none">
      </label>
      <label class="block">
        <span class="block mb-1 text-sm text-neutral-300">Subtítulo (Frase de impacto)</span>
        <input id="f_subtitulo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none">
      </label>
    </div>

    <div class="bg-neutral-800 p-6 rounded-xl border border-neutral-700">
      <h3 class="text-xl font-bold mb-4 text-orange-400">📜 Conteúdo</h3>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">História do RVJ</span>
        <textarea id="f_historia" rows="5" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none"></textarea>
      </label>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">Fotos (Uma URL do Cloudinary por linha)</span>
        <textarea id="f_fotos" rows="5" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none font-mono text-sm"></textarea>
      </label>
      <label class="block mb-4">
        <span class="block mb-1 text-sm text-neutral-300">Vídeos do YouTube (Um link por linha)</span>
        <textarea id="f_videos" rows="4" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none font-mono text-sm"></textarea>
      </label>
      <label class="block">
        <span class="block mb-1 text-sm text-neutral-300">Contato (Uma informação por linha)</span>
        <textarea id="f_contato" rows="4" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 focus:border-pink-500 outline-none"></textarea>
      </label>
    </div>

    <div class="flex flex-col md:flex-row gap-4 sticky bottom-4">
      <button onclick="salvar()" class="bg-green-600 hover:bg-green-700 flex-1 px-8 py-4 rounded-xl font-bold text-lg shadow-lg transition">💾 SALVAR ALTERAÇÕES</button>
      <a href="index.html" target="_blank" class="bg-neutral-700 hover:bg-neutral-600 flex-1 px-8 py-4 rounded-xl font-bold text-lg text-center shadow-lg transition">👁️ Ver Site</a>
    </div>
  </div>
</div>

<script>
function entrar() {
  if (document.getElementById("senha").value === "radical2027") {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("editor").classList.remove("hidden");
    carregar();
  } else {
    alert("Senha incorreta!");
  }
}

function carregar() {
  const d = JSON.parse(localStorage.getItem("siteDados")) || {};
  document.getElementById("f_heroImage").value = d.heroImage || "";
  document.getElementById("f_logo").value = d.logo || "";
  document.getElementById("f_tituloTipo").value = d.tituloTipo || "texto";
  document.getElementById("f_tituloConteudo").value = d.tituloConteudo || "";
  document.getElementById("f_subtitulo").value = d.subtitulo || "";
  document.getElementById("f_historia").value = d.historia || "";
  document.getElementById("f_fotos").value = (d.fotos || []).join("\n");
  document.getElementById("f_videos").value = (d.videos || []).join("\n");
  document.getElementById("f_contato").value = d.contato || "";
}

function salvar() {
  const dados = {
    heroImage: document.getElementById("f_heroImage").value,
    logo: document.getElementById("f_logo").value,
    tituloTipo: document.getElementById("f_tituloTipo").value,
    tituloConteudo: document.getElementById("f_tituloConteudo").value,
    subtitulo: document.getElementById("f_subtitulo").value,
    historia: document.getElementById("f_historia").value,
    fotos: document.getElementById("f_fotos").value.split("\n").filter(l => l.trim() !== ""),
    videos: document.getElementById("f_videos").value.split("\n").filter(l => l.trim() !== ""),
    contato: document.getElementById("f_contato").value
  };
  localStorage.setItem("siteDados", JSON.stringify(dados));
  alert("✅ Salvo com sucesso! Atualize a aba do site para ver as mudanças.");
}
</script>
</body>
</html>
