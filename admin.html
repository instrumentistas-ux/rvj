<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin - Aprofundamento Radical</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 text-white p-4 md:p-8">
<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl md:text-4xl font-bold mb-8 text-pink-500">⚙️ Painel do Administrador</h1>

  <div id="login" class="bg-neutral-800 p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl mb-4">Acesso Restrito</h2>
    <input id="senha" type="password" placeholder="Senha de administrador" class="w-full p-3 rounded bg-neutral-700 mb-4 border border-neutral-600 focus:border-pink-500 outline-none">
    <button onclick="verificarSenha()" class="bg-pink-600 hover:bg-pink-700 w-full px-6 py-3 rounded font-bold transition">Entrar</button>
    <p class="text-sm text-neutral-400 mt-4">Senha padrão: <code class="bg-neutral-700 px-2 py-1 rounded">radical2027</code></p>
  </div>

  <div id="editor" class="hidden space-y-6">
    <div class="bg-neutral-800 p-6 rounded-xl border border-neutral-700">
      <h3 class="text-xl font-bold mb-4 text-orange-400">🖼️ Seção Principal</h3>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Imagem de Fundo (URL)</span><input id="f_heroImage" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></label>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Logo do Menu (URL)</span><input id="f_logo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></label>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Link de Inscrição</span><input id="f_linkInscricao" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></label>
    </div>

    <div class="bg-neutral-800 p-6 rounded-xl border border-neutral-700">
      <h3 class="text-xl font-bold mb-4 text-orange-400">📝 Título</h3>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Tipo:</span>
        <select id="f_tituloTipo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"><option value="texto">Texto</option><option value="imagem">Imagem</option></select>
      </label>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Conteúdo (Texto ou URL da imagem)</span><input id="f_tituloConteudo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></label>
      <label class="block"><span class="block mb-1 text-sm text-neutral-300">Subtítulo</span><input id="f_subtitulo" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></label>
    </div>

    <div class="bg-neutral-800 p-6 rounded-xl border border-neutral-700">
      <h3 class="text-xl font-bold mb-4 text-orange-400">📜 Conteúdo</h3>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">História do RVJ</span><textarea id="f_historia" rows="5" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></textarea></label>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Fotos (Uma URL do Cloudinary por linha)</span><textarea id="f_fotos" rows="5" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 font-mono text-sm"></textarea></label>
      <label class="block mb-4"><span class="block mb-1 text-sm text-neutral-300">Vídeos YouTube (Um link por linha)</span><textarea id="f_videos" rows="4" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600 font-mono text-sm"></textarea></label>
      <label class="block"><span class="block mb-1 text-sm text-neutral-300">Contato (Uma info por linha)</span><textarea id="f_contato" rows="4" class="w-full p-3 rounded bg-neutral-700 border border-neutral-600"></textarea></label>
    </div>

    <div class="flex flex-col md:flex-row gap-4 sticky bottom-4">
      <button onclick="salvarNoFirebase()" id="btnSalvar" class="bg-green-600 hover:bg-green-700 flex-1 px-8 py-4 rounded-xl font-bold text-lg shadow-lg transition">💾 SALVAR NO SITE</button>
      <a href="index.html" target="_blank" class="bg-neutral-700 hover:bg-neutral-600 flex-1 px-8 py-4 rounded-xl font-bold text-lg text-center shadow-lg transition">👁️ Ver Site</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ⚠️ SUBSTITUA ESTE BLOCO PELO MESMO FIREBASE CONFIG DO INDEX.HTML
  const firebaseConfig = {
  apiKey: "AIzaSyBGmxb1nsmasgNXHlEZunXdcFa7uqRMrAo",
  authDomain: "site-rvj.firebaseapp.com",
  projectId: "site-rvj",
  storageBucket: "site-rvj.firebasestorage.app",
  messagingSenderId: "880852375777",
  appId: "1:880852375777:web:bcd4a19dada382efd63fa0"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.verificarSenha = function() {
    if (document.getElementById("senha").value === "radical2027") {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("editor").classList.remove("hidden");
      carregarDados();
    } else {
      alert("Senha incorreta!");
    }
  }

  async function carregarDados() {
    const btn = document.getElementById("btnSalvar");
    btn.textContent = "Carregando...";
    btn.disabled = true;

    try {
      const docRef = doc(db, "site", "configuracao");
      const docSnap = await getDoc(docRef);
      const d = docSnap.exists() ? docSnap.data() : {};

      document.getElementById("f_heroImage").value = d.heroImage || "";
      document.getElementById("f_logo").value = d.logo || "";
      document.getElementById("f_linkInscricao").value = d.linkInscricao || "https://app.novoingresso.com.br/eventos/aprofundamento-radical-2027";
      document.getElementById("f_tituloTipo").value = d.tituloTipo || "texto";
      document.getElementById("f_tituloConteudo").value = d.tituloConteudo || "";
      document.getElementById("f_subtitulo").value = d.subtitulo || "";
      document.getElementById("f_historia").value = d.historia || "";
      document.getElementById("f_fotos").value = (d.fotos || []).join("\n");
      document.getElementById("f_videos").value = (d.videos || []).join("\n");
      document.getElementById("f_contato").value = d.contato || "";
    } catch (error) {
      alert("Erro ao carregar dados. Verifique o console.");
      console.error(error);
    }
    
    btn.textContent = "💾 SALVAR NO SITE";
    btn.disabled = false;
  }

  window.salvarNoFirebase = async function() {
    const btn = document.getElementById("btnSalvar");
    btn.textContent = "Salvando...";
    btn.disabled = true;

    const dados = {
      heroImage: document.getElementById("f_heroImage").value,
      logo: document.getElementById("f_logo").value,
      linkInscricao: document.getElementById("f_linkInscricao").value,
      tituloTipo: document.getElementById("f_tituloTipo").value,
      tituloConteudo: document.getElementById("f_tituloConteudo").value,
      subtitulo: document.getElementById("f_subtitulo").value,
      historia: document.getElementById("f_historia").value,
      fotos: document.getElementById("f_fotos").value.split("\n").filter(l => l.trim() !== ""),
      videos: document.getElementById("f_videos").value.split("\n").filter(l => l.trim() !== ""),
      contato: document.getElementById("f_contato").value
    };

    try {
      await setDoc(doc(db, "site", "configuracao"), dados);
      alert("✅ SALVO COM SUCESSO! As alterações já estão visíveis para todo mundo no site.");
    } catch (error) {
      alert("❌ Erro ao salvar: " + error.message);
      console.error(error);
    }

    btn.textContent = "💾 SALVAR NO SITE";
    btn.disabled = false;
  }
</script>
</body>
</html>
